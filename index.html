<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Lab — Mock Draft</title>
<style>
/*STANDALONE-THEME-START*/
:root{color-scheme:dark;--hatch-widget-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--hatch-widget-text:#eef3f8;--hatch-widget-muted:#a3b1c3;--hatch-widget-surface:#121d2c;--hatch-widget-surface-muted:#1a293b;--hatch-widget-border:#293a50;--hatch-widget-accent:#85e5bc;--hatch-widget-on-accent:#09271d}
html{background:#0b1320}body{background:#0b1320;margin:0;min-width:320px}
/*STANDALONE-THEME-END*/
#md *{box-sizing:border-box}
#md{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--hatch-widget-text);max-width:100%;padding:4px}
#md h2{font-size:18px;margin:8px 0}
#md h3{font-size:15px;margin:10px 0 6px}
#md .muted{color:var(--hatch-widget-muted);font-size:12px}
#md .setup-pos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#md .posbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface);color:var(--hatch-widget-text);font-size:16px;font-weight:700;cursor:pointer}
#md .posbtn.sel{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border-color:var(--hatch-widget-accent)}
#md .bigbtn{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border:none;border-radius:10px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
#md .ghostbtn{background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
#md .ghostbtn:disabled{opacity:.4;cursor:default}
#md button:focus-visible,#md input:focus-visible,#md select:focus-visible{outline:2px solid var(--hatch-widget-accent);outline-offset:3px}
#md .listmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:5px 0}
#md .pager{display:flex;align-items:center;gap:7px;margin:7px 0;justify-content:center}
#md select{background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:6px 10px;font-size:14px}
#md .turnbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:12px;padding:10px 12px;margin:8px 0}
#md .turnbar .you{font-weight:800;color:var(--hatch-widget-accent)}
#md .cols{display:flex;gap:12px;align-items:flex-start}
#md .avail{flex:1.4;min-width:0}
#md .side{flex:1;min-width:0}
#md .filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#md .fchip{border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer}
#md .fchip.sel{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border-color:var(--hatch-widget-accent)}
#md input[type=text]{width:100%;background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:7px 10px;font-size:13px;margin:4px 0}
#md .plist{max-height:420px;overflow-y:auto;border:1px solid var(--hatch-widget-border);border-radius:10px}
#md .prow{padding:7px 10px;border-bottom:1px solid var(--hatch-widget-border);font-size:13px}
#md .prow:last-child{border-bottom:none}
#md .prow .l1{display:flex;align-items:center;gap:8px}
#md .prow .l2{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;padding-left:38px;font-size:11px;color:var(--hatch-widget-muted)}
#md .prank{width:30px;color:var(--hatch-widget-muted);font-size:12px;flex-shrink:0}
#md .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#md .ppos{font-size:10px;color:var(--hatch-widget-muted);flex-shrink:0}
#md .pstat{width:40px;text-align:right;color:var(--hatch-widget-muted);font-size:11px;flex-shrink:0}
#md .draftbtn{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
#md .draftbtn:disabled{opacity:.35;cursor:default}
#md .rlist{max-height:420px;overflow-y:auto;border:1px solid var(--hatch-widget-border);border-radius:10px}
#md .rrow{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--hatch-widget-border);font-size:13px;align-items:center}
#md .rrow:last-child{border-bottom:none}
#md .rpick{width:64px;color:var(--hatch-widget-muted);font-size:11px;flex-shrink:0}
#md .tabs{display:flex;gap:6px;margin:8px 0}
#md .boardwrap{overflow-x:auto;border:1px solid var(--hatch-widget-border);border-radius:10px;max-height:440px;overflow-y:auto}
#md table.board{border-collapse:collapse;font-size:11px;min-width:900px}
#md table.board th,#md table.board td{border:1px solid var(--hatch-widget-border);padding:4px 6px;text-align:left;white-space:nowrap}
#md table.board th{background:var(--hatch-widget-surface-muted);position:sticky;top:0}
#md table.board td.you{background:var(--hatch-widget-surface-muted);font-weight:700}
#md table.board td.future-you{box-shadow:inset 0 0 0 2px var(--hatch-widget-accent)}
#md .nextpick{font-size:12px;color:var(--hatch-widget-muted)}
#md .nextpick b{color:var(--hatch-widget-accent)}
#md .scarcity{margin:10px 0;padding:10px 12px;background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:10px}
#md .scarcity h3{margin:0 0 8px;font-size:14px}
#md .catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px}
#md .catchip{background:var(--hatch-widget-surface-muted);border-radius:8px;padding:6px 4px;text-align:center}
#md .catchip.hot{box-shadow:inset 0 0 0 2px #e0533d}
#md .catname{display:block;font-size:10px;color:var(--hatch-widget-muted);font-weight:700}
#md .catnum{display:block;font-size:16px;font-weight:800}
#md .catbar{height:4px;background:var(--hatch-widget-border);border-radius:2px;margin-top:4px;overflow:hidden}
#md .catbar i{display:block;height:100%;background:var(--hatch-widget-accent);border-radius:2px}
#md .cbadge{font-size:10px;color:var(--hatch-widget-accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
#md .teamtag{font-size:10px;color:var(--hatch-widget-muted)}
#md .vdelta{font-size:10px;font-weight:800;padding:1px 6px;border-radius:9px;margin-left:5px;white-space:nowrap}
#md .vdelta.g{color:#85e5bc;background:#143d2e}
#md .vdelta.b{color:#ffb4ab;background:#4a1f1f}
#md .tierbreak{border-top:2px dashed var(--hatch-widget-accent);opacity:.45;margin:8px 4px 2px}
@media(max-width:640px){#md .cols{flex-direction:column}#md .avail,#md .side{width:100%}}

/* Draft Lab: local-only visual theme */
/* Draft Lab: single dark mint system (vars set in STANDALONE-THEME) */
html,body{background:#0b1320}
body{background:radial-gradient(ellipse at top right,#19352f66,transparent 55%),#0b1320;min-height:100vh}
#md{--hatch-widget-text:#eef3f8;--hatch-widget-muted:#a3b1c3;--hatch-widget-surface:#121d2c;--hatch-widget-surface-muted:#1a293b;--hatch-widget-border:#293a50;--hatch-widget-accent:#85e5bc;--hatch-widget-on-accent:#09271d}
#md{max-width:1440px;margin:auto;padding:28px 32px 48px;line-height:1.5}
#md .brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 24px;margin-bottom:24px;border-bottom:1px solid var(--hatch-widget-border)}
#md .brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;letter-spacing:-.6px}
#md .brandmark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--hatch-widget-accent);color:#09271d;font-size:25px}
#md .season{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--hatch-widget-muted)}
#md h2{font-size:30px;letter-spacing:-1px;margin:8px 0 10px;line-height:1.2}
#md h3{font-size:14px;letter-spacing:.2px;margin:20px 0 10px}
#md .muted{font-size:12px;line-height:1.7}
#md .setup-pos{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;max-width:850px;margin:14px 0 28px}
#md .posbtn{width:100%;height:58px;border-radius:12px;font-size:18px}
#md button{transition:background .15s,border-color .15s,box-shadow .15s}
#md button:not(:disabled):hover{border-color:var(--hatch-widget-accent);box-shadow:0 0 0 1px color-mix(in srgb, var(--hatch-widget-accent) 35%, transparent)}
#md .bigbtn{padding:13px 24px;border-radius:12px;margin-top:18px}
#md .ghostbtn{min-height:40px;background:transparent}
#md .turnbar{padding:18px 20px;margin:0 0 18px;border-left:3px solid var(--hatch-widget-accent);box-shadow:0 8px 24px #0002}
#md .turnbar .you{font-size:12px;letter-spacing:1.2px}
#md .cols{gap:20px}
#md .avail,#md .side{background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:16px;padding:18px}
#md .avail{flex:1.5}#md .side{flex:1}
#md .avail>h3,#md .side>h3:first-child{margin-top:0}
#md .filters{gap:7px;margin:12px 0}
#md .fchip{padding:7px 13px;border-radius:8px}
#md .tabs{margin:18px 0 12px}
#md input[type=text]{padding:12px 14px;border-radius:10px;background:#0d1724;font-size:14px}
#md select{min-height:42px}
#md .plist{max-height:560px;border:0;border-radius:0}
#md .listmeta{position:sticky;top:0;background:var(--hatch-widget-surface);padding:8px 0;z-index:1;margin:0}
#md .prow{padding:13px 4px;font-size:14px}
#md .prow:hover{background:#1a293b88}
#md .prow .l2{padding-left:38px;margin-top:5px;gap:4px 12px}
#md .draftbtn{min-height:36px;padding:7px 14px}
#md .prank{font-variant-numeric:tabular-nums}
#md .teamtag{display:inline-block;border-radius:4px;background:#223247;padding:1px 5px;margin-left:3px;letter-spacing:.4px}
#md .injtag{display:inline-block;border-radius:4px;background:#5a1f1f;color:#ffb4ab;padding:1px 5px;margin-left:3px;letter-spacing:.4px;font-weight:700;cursor:help}
#md .injtag:focus-visible{outline:2px solid #ffb4ab;outline-offset:2px}
#md .rrow{padding:11px 12px;min-height:43px}
#md .rpick{font-size:10px;font-weight:700;letter-spacing:.8px;width:48px}
#md .rlist{max-height:470px;background:#0d172466}
#md .scarcity{padding:16px 18px;border-radius:14px;margin:14px 0}
#md details.scarcity{background:transparent;font-size:12px}
#md summary{cursor:pointer;color:var(--hatch-widget-muted)}
#md summary b{color:var(--hatch-widget-text)}
#md .catgrid{gap:8px}#md .catchip{padding:10px 6px;border:1px solid var(--hatch-widget-border);background:#0e1928}
#md .catnum{font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.7px}
#md .catname{letter-spacing:.7px}#md .catbar{height:3px;margin-top:8px}
#md table.board th,#md table.board td{padding:10px 12px}#md table.board th{z-index:1}
#md .boardwrap{max-height:600px}
#md .pager{justify-content:space-between;padding-top:12px}
#md .pname{white-space:normal;overflow-wrap:anywhere}
#md button:focus-visible,#md input:focus-visible,#md select:focus-visible,#md summary:focus-visible{outline:2px solid var(--hatch-widget-accent);outline-offset:3px}
@media(max-width:900px){#md{padding:20px 18px 32px}#md .setup-pos{grid-template-columns:repeat(6,1fr)}#md .cols{flex-direction:column}#md .avail,#md .side{width:100%}}
@media(max-width:480px){#md{padding:16px 12px 28px}#md h2{font-size:26px}#md .brandbar{padding-bottom:18px;margin-bottom:18px}#md .season{font-size:9px;letter-spacing:.5px}#md .avail,#md .side{padding:12px}#md .catgrid{grid-template-columns:repeat(3,1fr)}#md .turnbar{padding:14px}#md .posbtn{height:48px}#md .rrow{gap:5px}}
@media(prefers-reduced-motion:reduce){#md button{transition:none}}
#md .playoffbadge{font-weight:600;font-size:11px;white-space:nowrap}
#md .playoffbadge.bad{color:#ff8a7a}#md .playoffbadge.ok{color:#ffd479}#md .playoffbadge.good{color:#85e5bc}
#md .catmu{display:inline-block;font-size:11px;font-weight:700;margin:0 3px;white-space:nowrap}
#md .catmu.win{color:#85e5bc}#md .catmu.even{color:#ffd479}#md .catmu.loss{color:#ff8a7a}
#md .unrated{color:var(--hatch-widget-muted);font-size:11px;font-weight:700;cursor:help}
#md .catdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 2px;vertical-align:middle}
#md .catdot.win{background:#85e5bc}#md .catdot.even{background:#ffd479}#md .catdot.loss{background:#ff8a7a}
#md .playoffnote a{color:#85e5bc}
#md .playofftable{width:100%;border-collapse:collapse;font-size:12px}
#md .playofftable th,#md .playofftable td{padding:8px;text-align:left;border-bottom:1px solid var(--hatch-widget-border)}
#md .playofftable th{background:#1a293b}
#md .playofftable td:not(:first-child){font-variant-numeric:tabular-nums}
#md .playofftable tr.bad td:last-child{color:#ff8a7a;font-weight:700}
#md .playofftable tr.ok td:last-child{color:#ffd479;font-weight:700}
#md .playofftable tr.good td:last-child{color:#85e5bc;font-weight:700}

/* UX polish: calm density, touch intel, a11y live */
#md .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#md .filters-disclose{margin:10px 0 4px;border:1px solid var(--hatch-widget-border);border-radius:12px;background:#0d1724;padding:0 12px}
#md .filters-disclose>summary{list-style:none;cursor:pointer;padding:10px 2px;font-size:13px;font-weight:600;color:var(--hatch-widget-text)}
#md .filters-disclose>summary::-webkit-details-marker{display:none}
#md .filters-disclose>summary::before{content:"▸ ";color:var(--hatch-widget-accent)}
#md .filters-disclose[open]>summary::before{content:"▾ "}
#md .filters-disclose .filters{margin:0 0 12px}
#md details.scarcity{margin:10px 0;padding:10px 14px;border:1px solid var(--hatch-widget-border);border-radius:14px;background:var(--hatch-widget-surface)}
#md details.scarcity>summary{list-style:none;cursor:pointer;padding:4px 0;font-size:13px}
#md details.scarcity>summary::-webkit-details-marker{display:none}
#md details.scarcity>summary::before{content:"▸ ";color:var(--hatch-widget-accent)}
#md details.scarcity[open]>summary::before{content:"▾ "}
#md details.scarcity .catgrid{margin-top:10px}
#md .catchip{cursor:pointer;position:relative;user-select:none}
#md .catchip:focus-visible{outline:2px solid var(--hatch-widget-accent);outline-offset:2px}
#md .catchip[aria-expanded="true"]{box-shadow:inset 0 0 0 1px var(--hatch-widget-accent)}
#md .cattops{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--hatch-widget-border);font-size:10px;line-height:1.45;color:var(--hatch-widget-muted);text-align:left}
#md .cattops[hidden]{display:none}
#md .cattops b{color:var(--hatch-widget-text);font-weight:700}
#md .injtag{display:inline-block;border:0;border-radius:4px;background:#5a1f1f;color:#ffb4ab;padding:1px 5px;margin-left:3px;letter-spacing:.4px;font-weight:700;font-size:10px;font-family:inherit;cursor:pointer;line-height:1.4}
#md .injtag[aria-expanded="true"]{box-shadow:0 0 0 1px #ffb4ab}
#md .injdetail{display:block;margin:6px 0 2px 38px;padding:8px 10px;background:#3a1515;border:1px solid #7a3030;border-radius:8px;color:#ffb4ab;font-size:11px;line-height:1.45;max-width:28rem;font-weight:500}
#md .injdetail[hidden]{display:none}
#md .prow .injdetail,#md .rrow .injdetail{white-space:normal}
#md .cols.glance .side{flex:1.55}#md .cols.glance .avail{flex:1}
#md .viewtabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
#md .viewtabs .muted{margin-right:4px}
@media(max-width:480px){#md .filters-disclose{padding:0 10px}#md .injdetail{margin-left:0}}

/* Pick coach panel (advisory-only; UX polish hooks) */
/* pc-strength-chips: mint-border strength pills from PLAYERS[i].c */
/* pc-source-truth: model/fallback marker + soft-error copy (preview verify) */
#md .pick-coach{padding:4px 0 8px}
#md .pick-coach .pc-card{border:1px solid var(--hatch-widget-border);border-radius:12px;background:#0d1724;padding:14px 16px;margin-top:8px}
#md .pick-coach .pc-head{margin-bottom:10px}
#md .pick-coach .pc-name{font-size:16px;font-weight:700;letter-spacing:-.2px}
#md .pick-coach .pc-meta{font-size:12px;margin-top:4px}
#md .pick-coach .pc-source{font-size:11px;margin-top:4px;letter-spacing:.2px}
#md .pick-coach .pc-source[hidden]{display:none}
#md .pick-coach .pc-strengths{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#md .pick-coach .pc-strengths[hidden]{display:none}
#md .pick-coach .pc-chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;line-height:1.3;padding:3px 9px;border-radius:999px;border:1px solid #2d7258;color:#85e5bc;background:#143d2e66}

/* Movers / role outlook chips (list row + pick coach) */
#md .mv-chip,#md .role-chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.25px;line-height:1.3;padding:1px 6px;border-radius:999px;border:1px solid var(--hatch-widget-border);color:var(--hatch-widget-muted);background:#121c28}
#md .role-chip.role-up{color:#85e5bc;border-color:#2d7258;background:#143d2e66}
#md .role-chip.role-down{color:#e8c48a;border-color:#80652a;background:#3a2e1666}
#md .pick-coach .pc-chip.mv-chip{color:var(--hatch-widget-muted);border-color:var(--hatch-widget-border);background:#121c28;font-weight:700}
#md .pick-coach .pc-chip.role-up{color:#85e5bc;border-color:#2d7258;background:#143d2e66}
#md .pick-coach .pc-chip.role-down{color:#e8c48a;border-color:#80652a;background:#3a2e1666}
#md .pick-coach .pc-proj-meta{font-size:11px;margin-top:2px;color:var(--hatch-widget-muted)}
#md .pick-coach .pc-proj-meta[hidden]{display:none}

#md .pick-coach .pc-playoff{margin:0 0 8px;font-size:11px}
#md .pick-coach .pc-score{display:none} /* demoted: do not hero-render Poor–Excellent */
#md .pick-coach .pc-score-quiet{font-size:11px;margin:6px 0 0;line-height:1.4}
#md .pick-coach .pc-choice{display:inline-block;font-size:11px;font-weight:700;line-height:1.4;margin-top:2px;padding:2px 9px;border:1px solid transparent;border-radius:999px;text-transform:capitalize;letter-spacing:.2px}
#md .pick-coach .pc-choice-take{color:#85e5bc;background:#143d2e;border-color:#2d7258}
#md .pick-coach .pc-choice-wait{color:var(--hatch-widget-muted);background:var(--hatch-widget-surface-muted);border-color:var(--hatch-widget-border)}
#md .pick-coach .pc-choice-reach{color:#ffd479;background:#493a1c;border-color:#80652a}
#md .pick-coach .pc-choice-pass{color:#f0a8a8;background:#3a1d1d;border-color:#7a3535}
#md .pick-coach .pc-pass[hidden]{display:none}
#md .pick-coach .pc-pass-sub{margin:4px 0 0;font-size:11px;line-height:1.4}
#md .pick-coach .pc-pass .pc-why,#md .pick-coach .pc-pass .pc-conf{font-size:12px;margin:8px 0 0;line-height:1.5}
#md .pick-coach .pc-target{font-size:11px;margin:0 0 8px;color:var(--hatch-widget-muted)}
#md .pick-coach .pc-target[hidden]{display:none}
/* Lean: outline chip, quieter than filled suggest — no glow */
#md .pick-coach .pc-choice-lean{font-weight:600;box-shadow:none;text-transform:none;letter-spacing:.15px}
#md .pick-coach .pc-choice-lean-take{color:rgba(133,229,188,.72);background:rgba(20,61,46,.10);border-color:rgba(45,114,88,.58)}
#md .pick-coach .pc-choice-lean-wait{color:color-mix(in srgb,var(--hatch-widget-muted) 70%,transparent);background:rgba(255,255,255,.06);border-color:color-mix(in srgb,var(--hatch-widget-border) 60%,transparent)}
#md .pick-coach .pc-choice-lean-reach{color:rgba(255,212,121,.72);background:rgba(73,58,28,.10);border-color:rgba(128,101,42,.58)}

/* Mobile Pick coach dock (≤900px): list + coach split; no page yo-yo on focus */
/* coach-dock-mobile: distinctive marker for preview deploy verify */
/* coach-dock-fix: overflow lock only on .cols — Room tabs stay clickable above dock */
@media(max-width:900px){

  #md.coach-dock-active{display:flex;flex-direction:column;padding-bottom:0;box-sizing:border-box}

var CATS9=["PTS","REB","AST","STL","BLK","3PM","FG%","FT%","TO"];
/* Category scarcity, BM-style: per-game category values (z-scores) aggregated
   across the available player pool. Replacement level per category = mean
   value of consensus ranks 150-170 (the end-of-draft tier). Each cell shows
   the share of draftable above-replacement value still on the board. */
var _scarcBase=null;
function scarcityBase(){
  if(_scarcBase)return _scarcBase;
  var idx=[],i;
  for(i=0;i<PLAYERS.length;i++){var d=PDATA[PLAYERS[i].n];if(d&&d.cv)idx.push(i);}
  var ord=idx.slice().sort(function(a,b){return consRank(PLAYERS[a])-consRank(PLAYERS[b]);});
  var repl=[0,0,0,0,0,0,0,0,0],cnt=0;
  for(var k=149;k<170&&k<ord.length;k++){var cv=PDATA[PLAYERS[ord[k]].n].cv;for(var c=0;c<9;c++)repl[c]+=cv[c];cnt++;}
  for(var c2=0;c2<9;c2++)repl[c2]/=Math.max(1,cnt);
  var start=[0,0,0,0,0,0,0,0,0];
  idx.forEach(function(j){var v2=PDATA[PLAYERS[j].n].cv;for(var c3=0;c3<9;c3++){var vv=v2[c3]-repl[c3];if(vv>0)start[c3]+=vv;}});
  _scarcBase={idx:idx,repl:repl,start:start};
  return _scarcBase;
}
function renderScarcity(){
  var base=scarcityBase(),taken={},i,c;
  for(i=0;i<state.log.length;i++)taken[state.log[i]]=1;
  var rem=[0,0,0,0,0,0,0,0,0],tops=[],pcts=[];
  for(c=0;c<9;c++)tops.push([]);
  base.idx.forEach(function(j){
    if(taken[j])return;
    var pl=PLAYERS[j],cv=PDATA[pl.n].cv;
    for(c=0;c<9;c++){var v=cv[c]-base.repl[c];if(v>0){rem[c]+=v;tops[c].push({n:pl.n,v:v});}}
  });
  CATS9.forEach(function(cat,ci){
    var pct=base.start[ci]>0?Math.round(rem[ci]/base.start[ci]*100):0;
    if(pct>100)pct=100;if(pct<0)pct=0;
    pcts.push({cat:cat,pct:pct,ci:ci});
  });
  var quiet=pcts.slice().sort(function(a,b){return a.pct-b.pct;}).slice(0,3).map(function(x){return x.cat+" "+x.pct+"%";}).join(" · ");
  var h='<details class="scarcity" id="mdscarcity"'+(state.scarcityOpen?' open':'')+'>';
  h+='<summary><b>Category scarcity</b> <span class="muted">'+(quiet||"share of draftable value still available")+'</span></summary>';
  h+='<div class="catgrid">';
  pcts.forEach(function(row){
    var cat=row.cat,ci=row.ci,pct=row.pct;
    var hue=Math.round(pct*1.2);
    tops[ci].sort(function(a,b){return b.v-a.v;});
    var tipRows=tops[ci].slice(0,3);
    var tip=tipRows.map(function(t){return t.n+" +"+t.v.toFixed(1);}).join(", ")||"nothing above replacement";
    var topsHtml=tipRows.length?tipRows.map(function(t){return esc(t.n)+" <b>+"+t.v.toFixed(1)+"</b>";}).join("<br>"):"nothing above replacement";
    h+='<div class="catchip'+(pct<=35?' hot':'')+'" tabindex="0" role="button" aria-expanded="false" aria-label="'+esc(cat)+' '+pct+' percent remaining. Most left: '+esc(tip)+'">';
    h+='<span class="catname">'+cat+'</span><span class="catnum" style="color:hsl('+hue+',62%,55%)">'+pct+'%</span><div class="catbar"><i style="width:'+pct+'%;background:hsl('+hue+',62%,45%)"></i></div>';
    h+='<div class="cattops" hidden><b>Top available</b><br>'+topsHtml+'</div></div>';
  });
  h+='</div><p class="muted">BM-style 2025-26 per-game category values (z-scores; FG%/FT% volume-weighted, TO inverted). Replacement = mean of consensus ranks 150&ndash;170. Tap a category chip to see top contributors.</p></details>';
  return h;
}
function wireScarcityToggles(root){
  if(!root)return;
  var panel=root.querySelector("#mdscarcity")||root;
  panel.querySelectorAll(".catchip").forEach(function(chip){
    function toggle(){
      var tops=chip.querySelector(".cattops");if(!tops)return;
      var willOpen=tops.hidden;
      panel.querySelectorAll(".cattops").forEach(function(d){d.hidden=true;});
      panel.querySelectorAll(".catchip").forEach(function(c){c.setAttribute("aria-expanded","false");});
      if(willOpen){tops.hidden=false;chip.setAttribute("aria-expanded","true");}
    }
    chip.addEventListener("click",function(e){e.preventDefault();toggle();});
    chip.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
  });
  var det=root.querySelector("#mdscarcity");
  if(det)det.addEventListener("toggle",function(){state.scarcityOpen=det.open;save();});
}

function visibleCandidateIndexes(){
  var taken={},i;for(i=0;i<state.log.length;i++)taken[state.log[i]]=1;
  var q=state.q.toLowerCase(),f=state.f,cands=[];
  for(i=0;i<PLAYERS.length;i++){
    if(taken[i])continue;var pl=PLAYERS[i];
    if(f!=="All"&&pl.p.indexOf(f)<0)continue;
    if(q&&pl.n.toLowerCase().indexOf(q)<0)continue;
    cands.push(i);
  }
  var srt=state.sort||"cons";
  function skey(x){return x==null?1e9:x;}
  if(srt==="adp")cands.sort(function(a,b){return skey(PLAYERS[a].adp)-skey(PLAYERS[b].adp);});
  else if(srt==="last")cands.sort(function(a,b){return skey(PLAYERS[a].last)-skey(PLAYERS[b].last);});
  else if(srt==="lastTotal")cands.sort(function(a,b){return skey(PLAYERS[a].lastTotal)-skey(PLAYERS[b].lastTotal);});
  else if(srt==="cons")cands.sort(function(a,b){return consRank(PLAYERS[a])-consRank(PLAYERS[b]);});
  else cands.sort(function(a,b){return PLAYERS[a].r-PLAYERS[b].r;});

}

/* Deterministic pick signals for the coach. Computed locally from market data
 * + curated edges — Jev explains these, it doesn't vote via confidence. */
function buildPickSignals(pl, pickNumber, nextPick, openSlots, taken) {
  try {
    if (typeof window.PickSignals === "undefined") return null;
    var PS = window.PickSignals;
    var available = [];
    for (var i = 0; i < PLAYERS.length; i++) {
      if (!taken[i]) available.push(PLAYERS[i]);
    }
    // netVac is cached per page load (depends only on static data).
    if (!window._netVacCache && typeof MOVES !== "undefined" && typeof VACATED_USAGE !== "undefined") {
      window._netVacCache = PS.netVacated(PLAYERS, MOVES, VACATED_USAGE);
    }
    var ctx = {
      moves: (typeof MOVES !== "undefined") ? MOVES : {},
      netVac: window._netVacCache || {},
      playoffStart: (typeof state !== "undefined" && state.playoffStart) || 20
    };
    return PS.evaluate(pl, {
      pick: pickNumber,
      nextPick: nextPick > 0 ? nextPick : pickNumber + 23,
      available: available,
      openSlots: openSlots,
      ctx: ctx
    });
  } catch (e) { return null; }
}
function scarcityRemPcts(){
  var base=scarcityBase(),taken={},i,c;
  for(i=0;i<state.log.length;i++)taken[state.log[i]]=1;
  var rem=[0,0,0,0,0,0,0,0,0],out={};
  base.idx.forEach(function(j){
    if(taken[j])return;
    var cv=PDATA[PLAYERS[j].n].cv;
    for(c=0;c<9;c++){var v=cv[c]-base.repl[c];if(v>0)rem[c]+=v;}
  });
  CATS9.forEach(function(cat,ci){
    var pct=base.start[ci]>0?Math.round(rem[ci]/base.start[ci]*100):0;
    if(pct>100)pct=100;if(pct<0)pct=0;
    out[cat]=pct;
  });
  return out;
}

function softAdpClause(choice, pickNumber, adp){
  if(adp==null||!isFinite(Number(adp)))return "";
  if(choice==="pass")return ""; // deterministic reasons already carry the value statement
  var delta=pickNumber-Number(adp);
  if(choice==="take"){
    if(delta>=3)return "value vs ADP";
    if(delta<=-3)return "near ADP";
    return "near ADP";
  }
  if(choice==="reach")return "early vs ADP";
  if(choice==="wait")return "can wait vs ADP";
  if(Math.abs(delta)<=2)return "near ADP";
  if(delta>2)return "value vs ADP";
  return "early vs ADP";

function buildPickCoachWhy(pl, choice, pickNumber, jevWhy){
  var tags=pickCoachStrengthTags(pl);
  var rem=scarcityRemPcts();
  var covered=rosterCoveredCats();
  var parts=[],used={};
  var thin=[];
  tags.forEach(function(cat){
    var pct=rem[cat];
    if(pct!=null&&pct<=35){
      thin.push("fills thin "+cat+" ("+pct+"% left)");
      used[cat]=1;
    }
  });
  parts=parts.concat(thin);
  var elite=tags.filter(function(cat){return !used[cat];});
  if(choice==="wait"){
    var already=elite.filter(function(cat){return covered[cat];});
    var rest=elite.filter(function(cat){return !covered[cat];});
    if(already.length)parts.push(already.join(" · ")+" already covered");
    if(rest.length)parts.push(rest.length===1?("strong "+rest[0]):("elite "+rest.join(" · ")));
  }else if(elite.length){
    if(elite.length===1)parts.push("strong "+elite[0]);
    else parts.push("elite "+elite.join(" · "));
  }
  if(pl.inj){
    var injNote="INJ "+(pl.inj.injury||"listed");
    if(pl.inj.ret)injNote+=" · return "+pl.inj.ret;
    parts.push(injNote);
  }
  var adpBit=softAdpClause(choice, pickNumber, pl.adp);
  if(adpBit){
    if(choice==="reach"&&parts.length)parts.push("but "+adpBit);
    else parts.push(adpBit);
  }
  appendMoverWhy(pl, parts);
  appendVacatedWhy(pl, parts);
  var boardWhy=parts.join(" · ");
  var jw=(jevWhy||"").trim();
  if(jw){
    var opaque=/stub heuristic|scoreConfidence|choiceConfidence|model:|jev-|pick-quality/i.test(jw);
    var dup=boardWhy&&jw.toLowerCase().indexOf(boardWhy.toLowerCase().slice(0,24))>=0;
    if(!opaque&&!dup&&boardWhy){
      // append only if it adds something non-overlapping
      var jLow=jw.toLowerCase();
      var overlap=tags.some(function(t){return jLow.indexOf(t.toLowerCase())>=0;})||/adp|thin|inj/i.test(jw);
      if(!overlap)boardWhy=boardWhy+" · "+jw;
      else if(jw.length<120&&boardWhy.indexOf(jw)<0){/* prefer board vocab; skip opaque dup */}
    }else if(!boardWhy&&!opaque)boardWhy=jw;
    else if(!boardWhy)boardWhy="";
  }

}

function refreshPickCoach(){
  var root=el("pick-coach");
  if(!root||typeof window.PickCoach==="undefined")return;
  if(!isUserTurn()){pcShow(root,"pc-wait");updateCoachDockPeek("");syncCoachDock();return;}
  var pi=resolveFocusPi();
  if(pi==null){pcShow(root,"pc-empty");updateCoachDockPeek("");return;}
  pcShow(root,"pc-loading");
  var seq=++_pcEvalSeq;
  var payload=buildPickCoachPayload(pi);
  window.PickCoach.evaluate(payload).then(function(res){
    if(seq!==_pcEvalSeq)return;
    if(!res||res.stale)return;
    var still=el("pick-coach");
    if(!still)return;
    if(!isUserTurn()){pcShow(still,"pc-wait");return;}
    var pl=PLAYERS[pi];
    var card=still.querySelector(".pc-card");
    var nameEl=still.querySelector(".pc-name");
    var metaEl=still.querySelector(".pc-meta");
    if(nameEl)nameEl.textContent=pl.n;
    updateCoachDockPeek(pl.n);
    if(metaEl){
      var adpTxt=pl.adp!=null?String(pl.adp):"—";
      var meta="Pick #"+payload.pickNumber+" · ADP "+adpTxt;
      if(pl.projMpg!=null)meta+=" · proj MPG "+pl.projMpg;
      if(pl.projRank!=null)meta+=" · proj #"+pl.projRank;
      metaEl.textContent=meta;
    }
    fillPickCoachBoard(still, pl, payload);
    var srcEl=still.querySelector(".pc-source");
    if(srcEl){
      var src=(window.PickCoach.sourceLabel&&window.PickCoach.sourceLabel(res))||"";
      if(!src){
        if(res.error)src="Unavailable";
        else if(res.fallback==="preview-softfail"||res.fallback==="preview-network")src="Stub";
        else if(res.model==="stub"||res.fallback)src="Stub · offline";
        else if(res.model)src=/^jev/i.test(String(res.model))?"Jev":String(res.model);
      }
      srcEl.textContent=src;
      srcEl.hidden=!src;
      srcEl.title=res.model?String(res.model):(res.error?String(res.error):"");
    }
    var suggest=still.querySelector(".pc-suggest");
    var lean=still.querySelector(".pc-lean");
    var passEl=still.querySelector(".pc-pass");
    var uncertain=still.querySelector(".pc-uncertain");
    // Soft API/network errors must never look like suggest or lean —
    // UNLESS deterministic signals computed a verdict locally. The engine's
    // numbers stand on their own; only Jev's explanation degrades.
    var softFail=!!res.error;
    var scN=res.scoreConfidence!=null?Number(res.scoreConfidence):NaN;
    var ccN=res.choiceConfidence!=null?Number(res.choiceConfidence):NaN;
    var isDet=!!(res.deterministic&&res.signals&&res.signals.verdict);
    var detVerdict=isDet?String(res.signals.verdict).toLowerCase():null;
    // Deterministic: verdict already computed from signals — honor it directly,
    // never reclassify via confidence gates. Jev explains; it doesn't vote.
    // Fixture / leanDemo / forceConf: honor res.verdict — NEVER reclassify via confs
    // (confs can classify differently than the forced Soft lean / suggest paint).
    // Live: PickCoach.classifyVerdict uses TEMP max(scoreConf,choiceConf) + score/ADP floors.
    var verdict;
    if(isDet){
      // Native take|wait|pass|reach → display bands. take/reach are actions
      // (suggest band), wait is a hold (lean band), pass is its own band —
      // a confident pass is NOT "uncertain".
      verdict=detVerdict==="take"?"suggest":detVerdict==="wait"?"lean":detVerdict==="pass"?"pass":detVerdict==="reach"?"suggest":"uncertain";
    }else if(softFail){
      verdict="uncertain";
    }else if(res.fixture||res.fallback==="fixture"){
      // honor-res.verdict for fixtures (leanDemo / forceConf / coachFixture)
      verdict=(res.verdict==="suggest"||res.verdict==="lean"||res.verdict==="uncertain")?res.verdict:"uncertain";
    }else if(window.PickCoach&&typeof window.PickCoach.classifyVerdict==="function"){
      verdict=window.PickCoach.classifyVerdict(scN,ccN,{
        score:res.score,
        adp:payload.adp!=null?payload.adp:(pl&&pl.adp),
        rank:payload.rank!=null?payload.rank:(pl&&pl.r),
        pickNumber:payload.pickNumber
      });
    }else{
      // TEMP fallback: max banding 0.45/0.25 (match PickCoach.classifyVerdict)
      var maxC=(isFinite(scN)&&isFinite(ccN))?Math.max(scN,ccN):(isFinite(scN)?scN:ccN);
      verdict=(isFinite(maxC)&&maxC>=0.45)?"suggest":(isFinite(maxC)&&maxC>=0.25)?"lean":"uncertain";
      var scFloor=res.score!=null?Number(res.score):NaN;
      if(isFinite(scFloor)&&scFloor>=4)verdict="suggest";
      else if(isFinite(scFloor)&&scFloor>=3&&verdict==="uncertain")verdict="lean";
      var mAdp=payload.adp!=null?Number(payload.adp):(pl&&pl.adp!=null?Number(pl.adp):NaN);
      var mRank=payload.rank!=null?Number(payload.rank):(pl&&pl.r!=null?Number(pl.r):NaN);
      var mkt=isFinite(mAdp)?mAdp:(isFinite(mRank)?mRank:NaN);
      var pk=Number(payload.pickNumber);
      if(isFinite(mkt)&&mkt<=5&&isFinite(pk)&&pk<=mkt+3&&verdict==="uncertain")verdict="lean";
    }
    if(suggest)suggest.hidden=verdict!=="suggest";
    if(lean)lean.hidden=verdict!=="lean";
    if(passEl)passEl.hidden=verdict!=="pass";
    if(uncertain)uncertain.hidden=verdict!=="uncertain";
    function pcFmtConf(sc,cc,band){
      // TEMP: show max conf to match max() banding (live Jev often sc~0).
      var conf=isFinite(sc)&&isFinite(cc)?Math.max(sc,cc):isFinite(sc)?sc:cc;
      if(!isFinite(conf))return "";
      var b=band||"uncertain";
      return "Confidence "+Math.round(conf*100)+"% \u00b7 "+b;
    }
    var choice=res.choice||"";
    var choiceKind=choice==="take"?"take":choice==="reach"?"reach":choice==="pass"?"pass":"wait";
    // Deterministic target window: computed from the engine, but the V-8 / V /
    // ADP+4 heuristic is not yet validated as a survival estimate — keep the
    // UI element hidden until it is. (The verdict never came from a
    // confidence gate, so hide the conf line for deterministic results too;
    // it would imply the confidence drove the call.)
    var tgtEl=still.querySelector(".pc-target");
    if(tgtEl){
      tgtEl.textContent="";tgtEl.hidden=true;
    }
    if(verdict==="suggest"){
      var choiceEl=suggest?suggest.querySelector(".pc-choice"):null;
      var whyEl=suggest?suggest.querySelector(".pc-why"):null;
      var confEl=suggest?suggest.querySelector(".pc-conf"):null;
      var quietEl=suggest?suggest.querySelector(".pc-score-quiet"):null;
      if(choiceEl){
        choiceEl.className="pc-choice pc-choice-"+choiceKind;
        choiceEl.textContent=choiceKind==="take"?"Take":choiceKind==="reach"?"Reach":"Wait";
        choiceEl.hidden=false;
      }
      // Deterministic: the engine's reasons (+ agreeing Jev prose) render
      // verbatim. The legacy board-vocab blender would misfire its overlap
      // filter on the deterministic text (e.g. "ADP" in the reasons) and eat
      // the explanation.
      var boardWhy=isDet?(res.why||""):buildPickCoachWhy(pl, choiceKind, payload.pickNumber, res.why||"");
      if(whyEl)whyEl.textContent=boardWhy||(res.why||"");
      if(confEl){
        if(isDet){confEl.textContent="";confEl.hidden=true;}
        else{confEl.textContent=pcFmtConf(scN,ccN,verdict);confEl.hidden=!confEl.textContent;}
      }
      if(quietEl){
        var label=(window.PickCoach.scoreWord&&window.PickCoach.scoreWord(res.score))||res.scoreLabel||"";
        if(label&&res.score!=null){quietEl.textContent=label;quietEl.hidden=false;}
        else{quietEl.textContent="";quietEl.hidden=true;}
      }
    }else if(verdict==="lean"){
      var leanChoice=lean?lean.querySelector(".pc-choice"):null;
      var leanWhy=lean?lean.querySelector(".pc-why"):null;
      var leanConf=lean?lean.querySelector(".pc-conf"):null;
      var leanSub=lean?lean.querySelector(".pc-lean-sub"):null;
      var detWait=isDet&&detVerdict==="wait";
      if(leanChoice){
        if(detWait){
          // Deterministic WAIT is a computed instruction, not a soft lean.
          leanChoice.className="pc-choice pc-choice-wait";
          leanChoice.textContent="Wait";
        }else{
          leanChoice.className="pc-choice pc-choice-lean pc-choice-lean-"+choiceKind;
          leanChoice.textContent=choiceKind==="take"?"Lean take":choiceKind==="reach"?"Lean reach":"Lean wait";
        }
        leanChoice.hidden=false;
      }
      if(leanSub)leanSub.textContent=detWait?"Acceptable here — but a better option won't survive":"Soft lean — mid confidence";
      var leanBoardWhy=isDet?(res.why||""):buildPickCoachWhy(pl, choiceKind, payload.pickNumber, res.why||"");
      if(leanWhy)leanWhy.textContent=leanBoardWhy||(res.why||"");
      if(leanConf){
        if(isDet){leanConf.textContent="";leanConf.hidden=true;}
        else{leanConf.textContent=pcFmtConf(scN,ccN,verdict);leanConf.hidden=!leanConf.textContent;}
      }
    }else if(verdict==="pass"){
      var passWhy=passEl?passEl.querySelector(".pc-why"):null;
      var passConf=passEl?passEl.querySelector(".pc-conf"):null;
      var passBoardWhy=isDet?(res.why||""):buildPickCoachWhy(pl, "pass", payload.pickNumber, res.why||"");
      if(passWhy)passWhy.textContent=passBoardWhy||(res.why||"");
      if(passConf){passConf.textContent="";passConf.hidden=true;}
    }else{
      var uTitle=still.querySelector(".pc-uncertain-title");
      var uSub=still.querySelector(".pc-uncertain-sub");
      var uWhy=still.querySelector(".pc-uncertain-why");
      if(softFail){
        if(uTitle)uTitle.textContent="Coach unavailable";
        if(uSub)uSub.textContent="Unavailable — not a low-confidence read · your call";
      }else{
        if(uTitle)uTitle.textContent="Not sure enough to suggest";
        if(uSub)uSub.textContent="Low confidence — your call";
      }
      // Always paint mover / vacated why on uncertain (incl. softFail / unavailable).
      var uBits=[];
      var moverWhy=moverWhyClause(pl);
      if(moverWhy)uBits.push(moverWhy);
      var vac=vacatedWhyClause(pl);
      if(vac)uBits.push(vac);
      if(uWhy){
        uWhy.textContent=uBits.join(" · ");
        uWhy.hidden=!uBits.length;
      }
      var uConf=still.querySelector(".pc-uncertain .pc-conf");
      if(uConf){
        // Soft-fail may keep error quiet — skip conf % line when unavailable.
        if(softFail){uConf.textContent="";uConf.hidden=true;}
        else{
          uConf.textContent=pcFmtConf(scN,ccN,verdict);
          uConf.hidden=!uConf.textContent;
        }
      }
    }
    pcShow(still,"pc-card");
  });
}

  for(var t=0;t<TEAMS;t++){
    var entries=CORE.teamEntries(PLAYERS,state.log,t,TEAMS);
    var score=0,rated=0,unrated=0,cats=[0,0,0,0,0,0,0,0,0];
    entries.forEach(function(e){
      var d=(typeof PDATA!=="undefined"&&PDATA[e.player.n])||null;
      var cv=(d&&d.cv)||repl;
      if(d&&d.cv)rated++;else unrated++;
      for(var c=0;c<9;c++){score+=cv[c];cats[c]+=cv[c];}
    });
    teams.push({team:t,score:score,rated:rated,unrated:unrated,cats:cats});
  }
  var mean=teams.reduce(function(a,x){return a+x.score;},0)/teams.length;
  var vari=teams.reduce(function(a,x){return a+(x.score-mean)*(x.score-mean);},0)/teams.length;
  var std=Math.sqrt(vari)||1;
  teams.forEach(function(x){
    var z=(x.score-mean)/std;x.z=z;
    x.grade=z>=1.5?'A+':z>=1.0?'A':z>=0.5?'B+':z>=0?'B':z>-0.5?'C+':z>-1?'C':z>-1.5?'D':'F';
  });
  teams.sort(function(a,b){return b.score-a.score;});
  teams.forEach(function(x,i){x.rank=i+1;});
  return teams;
}
function catMatchup(userCats,oppCats){
  // Returns array of 9 'win'/'even'/'loss' vs the user's per-category totals.
  // |diff| <= 0.5 = even; user ahead by >0.5 = win; behind by >0.5 = loss.
  var out=[];
  for(var c=0;c<9;c++){
    var diff=userCats[c]-oppCats[c];
    out.push(diff>0.5?'win':diff<-0.5?'loss':'even');
  }
  return out;
}
function renderGrades(){
  var g=draftGrades();
  var me=g.filter(function(x){return x.team===userTeam();})[0];
  var muOrder=[6,7,5,0,1,2,3,4,8]; // FG% FT% 3PM Pts REB AST STL BLK TO
  var h='<h3>Draft grades</h3><div class="muted">Score = sum of 2025-26 per-game category values (9-cat z-scores) across the full roster. Higher is better. Historical production only — not a projection of 2026-27 totals.</div>';
  h+='<div class="muted" style="margin:6px 0">Category matchup = historical category-value comparison vs your team (2025-26 z-scores, not projected category totals). <span class="catmu win">PTS</span> = you win the category <span class="catmu even">PTS</span> = even <span class="catmu loss">PTS</span> = they win it. Tally is your wins-losses vs that team.</div>';
  h+='<div class="boardwrap"><table class="board"><thead><tr><th>#</th><th>Team</th><th>Score</th><th>Grade</th><th>Category matchup</th></tr></thead><tbody>';
  g.forEach(function(x){
    var you=x.team===userTeam();
    var unrated=x.unrated>0?' <span class="unrated" title="'+x.unrated+' player(s) without 2025-26 category data, counted at replacement level (mean of consensus ranks 150-170)">&#8224;'+x.unrated+'</span>':'';
    h+='<tr'+(you?' class="you"':'')+'><td><b>'+x.rank+'</b></td><td>'+esc(teamName(x.team))+(you?' (you)':'')+'</td><td>'+x.score.toFixed(1)+unrated+'</td><td><b>'+x.grade+'</b></td><td>';
    if(!you&&me){
      var mu=catMatchup(me.cats,x.cats);
      var w=0,l=0;
      mu.forEach(function(m){if(m==='win')w++;else if(m==='loss')l++;});
      h+='<b>'+w+'-'+l+'</b> ';
      muOrder.forEach(function(c){
        var diff=me.cats[c]-x.cats[c];
        h+='<span class="catmu '+mu[c]+'" title="'+CATS9[c]+': you '+me.cats[c].toFixed(1)+' vs '+x.cats[c].toFixed(1)+'">'+CATS9[c]+'</span>';
      });
    }else if(you){
      h+='<span class="muted">—</span>';
    }
    h+='</td></tr>';
  });
  h+='</tbody></table></div><p class="muted"><span class="unrated">&#8224;N</span> = N rostered players had no 2025-26 category data (injured stars, prospects) and were counted at replacement level. Bench and starters weighted equally; playoff schedule, injuries, and projected 2026-27 role changes are not factored in.</p>';
  return h;
}
function renderDone(){
  cancelPickCoach();
  var h='<h2>Draft complete</h2><div class="muted">Final roster from pick #'+state.draftPos+' ('+state.rounds+' rounds, 12 teams)</div>';
  h+='<button class="bigbtn" id="mdnew2">Run it back</button>';
  if(state.userTurns.length)h+='<button class="ghostbtn" id="mdundo2" style="margin-left:8px">Undo my last pick</button>';
  h+=viewTabsHtml()+'<div id="mdside"></div>';
  el("mdapp").innerHTML=h;
  announceLive((_pendingLive||"")+"Draft complete.");
  _pendingLive="";
  el("mdnew2").addEventListener("click",restartDraft);
  var undo=el("mdundo2");if(undo)undo.addEventListener("click",undoUserPick);
  el("mdapp").querySelectorAll("[data-view]").forEach(function(b){b.addEventListener("click",function(){setState({view:b.getAttribute("data-view")});});});
  renderSide();
}
function playoffBadge(pl){
 var v=window.PlayoffCore.counts(window.PlayoffData,pl.t,state.playoffStart);
 if(!v)return '<span class="playoffbadge">Playoffs \u2014 team unknown</span>';

}

 h+='<div class="catgrid">';
 sum.games.forEach(function(n,i){h+='<div class="catchip"><span class="catname">'+(sum.unknown?'KNOWN ':'')+'WEEK '+(i+1)+'</span><span class="catnum">'+n+'</span></div>';});
 h+='</div><p class="muted">'+sum.players+' players, including bench. '+sum.unknown+' unknown team schedules. These are scheduled opportunities, not guaranteed starts.</p>';
 if(mine.length){h+='<div class="boardwrap"><table class="playofftable"><thead><tr><th>Player / team</th><th>W1</th><th>W2</th><th>W3</th><th>Total</th></tr></thead><tbody>';
 mine.forEach(function(m){var p=PLAYERS[m.pi],v=window.PlayoffCore.counts(window.PlayoffData,p.t,state.playoffStart),r=v?window.PlayoffCore.rating(v):null;
 h+='<tr'+(r?' class="'+r+'"':'')+'><td>'+esc(p.n)+' <span class="teamtag">'+esc(p.t)+'</span></td>';
 [0,1,2].forEach(function(i){h+='<td>'+(v?v[i]:'\u2014')+'</td>';});
 h+='<td>'+(v?window.PlayoffCore.total(v):'\u2014')+'</td></tr>';});h+='</tbody></table></div>';}
 return h+'</details>';
}

  var host=el("mdplayoffhost");
  if(host){host.innerHTML="";host.style.display="none";}
}

function wirePlayoffSettings(root){
  if(!root)return;
  root.querySelectorAll("[data-pw]").forEach(function(b){b.addEventListener("click",function(){setState({playoffStart:Number(b.getAttribute("data-pw")),page:0});});});
}

  if(state.phase==="setup")renderSetup();
