/*STANDALONE-THEME-START*/
:root{--hatch-widget-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--hatch-widget-text:#ececf1;--hatch-widget-muted:#9a9aad;--hatch-widget-surface:#17171d;--hatch-widget-surface-muted:#22222c;--hatch-widget-border:#2e2e3a;--hatch-widget-accent:#5b6fae;--hatch-widget-on-accent:#ffffff}
html{background:#101014}body{background:#101014;margin:0;min-width:320px}
/*STANDALONE-THEME-END*/
#md *{box-sizing:border-box}
#md{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--hatch-widget-text);max-width:100%;padding:4px}
#md h2{font-size:18px;margin:8px 0}
#md h3{font-size:15px;margin:10px 0 6px}
#md .muted{color:var(--hatch-widget-muted);font-size:12px}
#md .setup-pos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#md .posbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface);color:var(--hatch-widget-text);font-size:16px;font-weight:700;cursor:pointer}
#md .posbtn.sel{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border-color:var(--hatch-widget-accent)}
#md .bigbtn{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border:none;border-radius:10px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
#md .ghostbtn{background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
#md .ghostbtn:disabled{opacity:.4;cursor:default}
#md button:focus-visible,#md input:focus-visible,#md select:focus-visible{outline:3px solid #aebfff;outline-offset:2px}
#md .listmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:5px 0}
#md .pager{display:flex;align-items:center;gap:7px;margin:7px 0;justify-content:center}
#md select{background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:6px 10px;font-size:14px}
#md .turnbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:12px;padding:10px 12px;margin:8px 0}
#md .turnbar .you{font-weight:800;color:var(--hatch-widget-accent)}
#md .cols{display:flex;gap:12px;align-items:flex-start}
#md .avail{flex:1.4;min-width:0}
#md .side{flex:1;min-width:0}
#md .filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#md .fchip{border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer}
#md .fchip.sel{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border-color:var(--hatch-widget-accent)}
#md input[type=text]{width:100%;background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:7px 10px;font-size:13px;margin:4px 0}
#md .plist{max-height:420px;overflow-y:auto;border:1px solid var(--hatch-widget-border);border-radius:10px}
#md .prow{padding:7px 10px;border-bottom:1px solid var(--hatch-widget-border);font-size:13px}
#md .prow:last-child{border-bottom:none}
#md .prow .l1{display:flex;align-items:center;gap:8px}
#md .prow .l2{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;padding-left:38px;font-size:11px;color:var(--hatch-widget-muted)}
#md .prank{width:30px;color:var(--hatch-widget-muted);font-size:12px;flex-shrink:0}
#md .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#md .ppos{font-size:10px;color:var(--hatch-widget-muted);flex-shrink:0}
#md .pstat{width:40px;text-align:right;color:var(--hatch-widget-muted);font-size:11px;flex-shrink:0}
#md .draftbtn{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
#md .draftbtn:disabled{opacity:.35;cursor:default}
#md .rlist{max-height:420px;overflow-y:auto;border:1px solid var(--hatch-widget-border);border-radius:10px}
#md .rrow{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--hatch-widget-border);font-size:13px;align-items:center}
#md .rrow:last-child{border-bottom:none}
#md .rpick{width:64px;color:var(--hatch-widget-muted);font-size:11px;flex-shrink:0}
#md .tabs{display:flex;gap:6px;margin:8px 0}
#md .boardwrap{overflow-x:auto;border:1px solid var(--hatch-widget-border);border-radius:10px;max-height:440px;overflow-y:auto}
#md table.board{border-collapse:collapse;font-size:11px;min-width:900px}
#md table.board th,#md table.board td{border:1px solid var(--hatch-widget-border);padding:4px 6px;text-align:left;white-space:nowrap}
#md table.board th{background:var(--hatch-widget-surface-muted);position:sticky;top:0}
#md table.board td.you{background:var(--hatch-widget-surface-muted);font-weight:700}
#md table.board td.future-you{box-shadow:inset 0 0 0 2px var(--hatch-widget-accent)}
#md .nextpick{font-size:12px;color:var(--hatch-widget-muted)}
#md .nextpick b{color:var(--hatch-widget-accent)}
#md .scarcity{margin:10px 0;padding:10px 12px;background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:10px}
#md .scarcity h3{margin:0 0 8px;font-size:14px}
#md .catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px}
#md .catchip{background:var(--hatch-widget-surface-muted);border-radius:8px;padding:6px 4px;text-align:center}
#md .catchip.hot{box-shadow:inset 0 0 0 2px #e0533d}
#md .catname{display:block;font-size:10px;color:var(--hatch-widget-muted);font-weight:700}
#md .catnum{display:block;font-size:16px;font-weight:800}
#md .catbar{height:4px;background:var(--hatch-widget-border);border-radius:2px;margin-top:4px;overflow:hidden}
#md .catbar i{display:block;height:100%;background:var(--hatch-widget-accent);border-radius:2px}
#md .cbadge{font-size:10px;color:var(--hatch-widget-accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
#md .teamtag{font-size:10px;color:var(--hatch-widget-muted)}
#md .vdelta{font-size:10px;font-weight:800;padding:1px 6px;border-radius:9px;margin-left:5px;white-space:nowrap}
#md .vdelta.g{color:#146c2e;background:#d9ecd9}
#md .vdelta.b{color:#a1231b;background:#f6d9d4}
#md .tierbreak{border-top:2px dashed var(--hatch-widget-accent);opacity:.45;margin:8px 4px 2px}
@media(max-width:640px){#md .cols{flex-direction:column}#md .avail,#md .side{width:100%}}

/* Courtside: local-only visual theme */
:root{color-scheme:dark;--hatch-widget-text:#eef3f8;--hatch-widget-muted:#a3b1c3;--hatch-widget-surface:#121d2c;--hatch-widget-surface-muted:#1a293b;--hatch-widget-border:#293a50;--hatch-widget-accent:#85e5bc;--hatch-widget-on-accent:#09271d}
html,body{background:#0b1320}
body{background:radial-gradient(ellipse at top right,#19352f66,transparent 55%),#0b1320;min-height:100vh}
#md{max-width:1440px;margin:auto;padding:28px 32px 48px;line-height:1.5}
#md .brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 24px;margin-bottom:24px;border-bottom:1px solid var(--hatch-widget-border)}
#md .brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800;letter-spacing:-.6px}
#md .brandmark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--hatch-widget-accent);color:#09271d;font-size:25px}
#md .season{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--hatch-widget-muted)}
#md h2{font-size:30px;letter-spacing:-1px;margin:8px 0 10px;line-height:1.2}
#md h3{font-size:14px;letter-spacing:.2px;margin:20px 0 10px}
#md .muted{font-size:12px;line-height:1.7}
#md .setup-pos{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;max-width:850px;margin:14px 0 28px}
#md .posbtn{width:100%;height:58px;border-radius:12px;font-size:18px}
#md button{transition:background .15s,border-color .15s,box-shadow .15s}
#md button:not(:disabled):hover{border-color:var(--hatch-widget-accent);box-shadow:0 0 0 1px #85e5bc55}
#md .bigbtn{padding:13px 24px;border-radius:12px;margin-top:18px}
#md .ghostbtn{min-height:40px;background:transparent}
#md .turnbar{padding:18px 20px;margin:0 0 18px;border-left:3px solid var(--hatch-widget-accent);box-shadow:0 8px 24px #0002}
#md .turnbar .you{font-size:12px;letter-spacing:1.2px}
#md .cols{gap:20px}
#md .avail,#md .side{background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:16px;padding:18px}
#md .avail{flex:1.5}#md .side{flex:1}
#md .avail>h3,#md .side>h3:first-child{margin-top:0}
#md .filters{gap:7px;margin:12px 0}
#md .fchip{padding:7px 13px;border-radius:8px}
#md .tabs{margin:18px 0 12px}
#md input[type=text]{padding:12px 14px;border-radius:10px;background:#0d1724;font-size:14px}
#md select{min-height:42px}
#md .plist{max-height:560px;border:0;border-radius:0}
#md .listmeta{position:sticky;top:0;background:var(--hatch-widget-surface);padding:8px 0;z-index:1;margin:0}
#md .prow{padding:13px 4px;font-size:14px}
#md .prow:hover{background:#1a293b88}
#md .prow .l2{padding-left:38px;margin-top:5px;gap:4px 12px}
#md .draftbtn{min-height:36px;padding:7px 14px}
#md .prank{font-variant-numeric:tabular-nums}
#md .teamtag{display:inline-block;border-radius:4px;background:#223247;padding:1px 5px;margin-left:3px;letter-spacing:.4px}
#md .rrow{padding:11px 12px;min-height:43px}
#md .rpick{font-size:10px;font-weight:700;letter-spacing:.8px;width:48px}
#md .rlist{max-height:470px;background:#0d172466}
#md .scarcity{padding:16px 18px;border-radius:14px;margin:14px 0}
#md details.scarcity{background:transparent;font-size:12px}
#md summary{cursor:pointer;color:var(--hatch-widget-muted)}
#md summary b{color:var(--hatch-widget-text)}
#md .catgrid{gap:8px}#md .catchip{padding:10px 6px;border:1px solid var(--hatch-widget-border);background:#0e1928}
#md .catnum{font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.7px}
#md .catname{letter-spacing:.7px}#md .catbar{height:3px;margin-top:8px}
#md table.board th,#md table.board td{padding:10px 12px}#md table.board th{z-index:1}
#md .boardwrap{max-height:600px}
#md .pager{justify-content:space-between;padding-top:12px}
#md .pname{white-space:normal;overflow-wrap:anywhere}
#md button:focus-visible,#md input:focus-visible,#md select:focus-visible,#md summary:focus-visible{outline:2px solid var(--hatch-widget-accent);outline-offset:3px}
@media(max-width:900px){#md{padding:20px 18px 32px}#md .setup-pos{grid-template-columns:repeat(6,1fr)}#md .cols{flex-direction:column}#md .avail,#md .side{width:100%}}
@media(max-width:480px){#md{padding:16px 12px 28px}#md h2{font-size:26px}#md .brandbar{padding-bottom:18px;margin-bottom:18px}#md .season{font-size:9px;letter-spacing:.5px}#md .avail,#md .side{padding:12px}#md .catgrid{grid-template-columns:repeat(3,1fr)}#md .turnbar{padding:14px}#md .posbtn{height:48px}#md .rrow{gap:5px}}
@media(prefers-reduced-motion:reduce){#md button{transition:none}}

/* Category scarcity, BM-style: per-game category values (z-scores) aggregated
   across the available player pool. Replacement level per category = mean
   value of consensus ranks 150-170 (the end-of-draft tier). Each cell shows
   the share of draftable above-replacement value still on the board. */
var _scarcBase=null;
function scarcityBase(){
  if(_scarcBase)return _scarcBase;
  var idx=[],i;
  for(i=0;i<PLAYERS.length;i++){var d=PDATA[PLAYERS[i].n];if(d&&d.cv)idx.push(i);}
  var ord=idx.slice().sort(function(a,b){return consRank(PLAYERS[a])-consRank(PLAYERS[b]);});
  var repl=[0,0,0,0,0,0,0,0,0],cnt=0;
  for(var k=149;k<170&&k<ord.length;k++){var cv=PDATA[PLAYERS[ord[k]].n].cv;for(var c=0;c<9;c++)repl[c]+=cv[c];cnt++;}
  for(var c2=0;c2<9;c2++)repl[c2]/=Math.max(1,cnt);
  var start=[0,0,0,0,0,0,0,0,0];
  idx.forEach(function(j){var v2=PDATA[PLAYERS[j].n].cv;for(var c3=0;c3<9;c3++){var vv=v2[c3]-repl[c3];if(vv>0)start[c3]+=vv;}});
  _scarcBase={idx:idx,repl:repl,start:start};
  return _scarcBase;
}
function renderScarcity(){
  var base=scarcityBase(),taken={},i,c;
  for(i=0;i<state.log.length;i++)taken[state.log[i]]=1;
  var rem=[0,0,0,0,0,0,0,0,0],tops=[];
  for(c=0;c<9;c++)tops.push([]);
  base.idx.forEach(function(j){
    if(taken[j])return;
    var pl=PLAYERS[j],cv=PDATA[pl.n].cv;
    for(c=0;c<9;c++){var v=cv[c]-base.repl[c];if(v>0){rem[c]+=v;tops[c].push({n:pl.n,v:v});}}
  });
  var h='<div class="scarcity"><h3>Category scarcity <span class="muted">share of draftable value still available</span></h3><div class="catgrid">';
  CATS9.forEach(function(cat,ci){
    var pct=base.start[ci]>0?Math.round(rem[ci]/base.start[ci]*100):0;
    if(pct>100)pct=100;if(pct<0)pct=0;
    var hue=Math.round(pct*1.2);
    tops[ci].sort(function(a,b){return b.v-a.v;});
    var tip=tops[ci].slice(0,3).map(function(t){return t.n+" +"+t.v.toFixed(1);}).join(", ")||"nothing above replacement";
    h+='<div class="catchip" title="Most '+cat+' left: '+esc(tip)+'"><span class="catname">'+cat+'</span><span class="catnum" style="color:hsl('+hue+',62%,36%)">'+pct+'%</span><div class="catbar"><i style="width:'+pct+'%;background:hsl('+hue+',62%,45%)"></i></div></div>';
  });
  return h+'</div><p class="muted">BM-style 2025-26 per-game category values (z-scores; FG%/FT% volume-weighted, TO inverted). Replacement = mean of consensus ranks 150&ndash;170.</p></div>';
}

  h+='<span style="flex:1"></span>';
  if(state.userTurns.length)h+='<button class="ghostbtn" id="mdundo">Undo my last pick</button>';
  if(state.phase!=="done"&&!isUserTurn())h+='<button class="ghostbtn" id="mdsim">Sim to my pick</button>';
  h+='<button class="ghostbtn" id="mdnew">Restart</button></div>';
  h+=renderDataHealth();
  h+=renderScarcity();
  h+='<div class="tabs"><button class="fchip'+(state.view==='team'?' sel':'')+'" data-view="team">My team</button>';
  h+='<button class="fchip'+(state.view==='board'?' sel':'')+'" data-view="board">Draft board</button></div>';
  h+='<div class="cols"><div class="avail">';
  h+='<h3>Available players</h3><input type="text" id="mdq" aria-label="Search available players" placeholder="Search players..." value="'+esc(state.q)+'">';
  h+='<div class="filters">';
  ["All","PG","SG","SF","PF","C"].forEach(function(f){h+='<button class="fchip'+(state.f===f?' sel':'')+'" data-f="'+f+'">'+f+'</button>';});
  h+='</div><div class="filters"><span class="muted">Sort:</span>';
  [["cons","Consensus","Average of built-in rank and Yahoo ADP"],["rank","Rank","Built-in preseason rank (sim order)"],["adp","ADP","Yahoo ADP via Hashtag Basketball (Sep 2026)"],["last","Last · PER","2025-26 nine-category per-game rank (Basketball Monster / Hashtag)"],["lastTotal","Last · TOT","2025-26 nine-category TOTALS rank — derived from Basketball-Reference season totals, not a published rank"]].forEach(function(s){h+='<button class="fchip'+((state.sort||"cons")===s[0]?' sel':'')+'" data-sort="'+s[0]+'" title="'+s[2]+'">'+s[1]+'</button>';});
  h+='</div><div class="plist" id="mdplist"></div><div id="mdpager"></div></div>';
  h+='<div class="side" id="mdside"></div></div>';
  el("mdapp").innerHTML=h;
  el("mdapp").querySelectorAll("[data-view]").forEach(function(b){b.addEventListener("click",function(){setState({view:b.getAttribute("data-view")});});});
  el("mdapp").querySelectorAll("[data-f]").forEach(function(b){b.addEventListener("click",function(){setState({f:b.getAttribute("data-f"),page:0});});});
  el("mdapp").querySelectorAll("[data-sort]").forEach(function(b){b.addEventListener("click",function(){setState({sort:b.getAttribute("data-sort"),page:0});});});
  var q=el("mdq");q.addEventListener("input",function(){state.q=q.value;state.page=0;save();renderList();});
  q.addEventListener("keydown",function(e){e.stopPropagation();});
  var sim=el("mdsim");if(sim)sim.addEventListener("click",advance);
  var undo=el("mdundo");if(undo)undo.addEventListener("click",undoUserPick);
  el("mdnew").addEventListener("click",restartDraft);
  renderList();renderSide();
}
function renderList(){
  var taken={},i;for(i=0;i<state.log.length;i++)taken[state.log[i]]=1;
  var q=state.q.toLowerCase(),f=state.f,ut=isUserTurn(),cands=[];
  for(i=0;i<PLAYERS.length;i++){
    if(taken[i])continue;var pl=PLAYERS[i];
    if(f!=="All"&&pl.p.indexOf(f)<0)continue;
    if(q&&pl.n.toLowerCase().indexOf(q)<0)continue;
    cands.push(i);
  }
  var srt=state.sort||"cons";
  function skey(x){return x==null?1e9:x;}
  if(srt==="adp")cands.sort(function(a,b){return skey(PLAYERS[a].adp)-skey(PLAYERS[b].adp);});
  else if(srt==="last")cands.sort(function(a,b){return skey(PLAYERS[a].last)-skey(PLAYERS[b].last);});
  else if(srt==="lastTotal")cands.sort(function(a,b){return skey(PLAYERS[a].lastTotal)-skey(PLAYERS[b].lastTotal);});
  else if(srt==="cons")cands.sort(function(a,b){return consRank(PLAYERS[a])-consRank(PLAYERS[b]);});
  function tierKey(i){var p=PLAYERS[i];if(srt==="adp")return p.adp==null?1e9:p.adp;return consRank(p);}
  function disp(x){return x==null?'—':x;}
  var pageSize=50,pageCount=Math.max(1,Math.ceil(cands.length/pageSize));
  if(state.page>=pageCount)state.page=pageCount-1;
  var from=state.page*pageSize,to=Math.min(cands.length,from+pageSize),rows=[];
  rows.push('<div class="listmeta"><span class="muted">'+cands.length+' available · showing '+(cands.length?from+1:0)+'–'+to+'</span><span class="muted">Page '+(state.page+1)+'/'+pageCount+'</span></div>');
  for(var k=from;k<to;k++){
    if((srt==="adp"||srt==="cons")&&k>0){var kk=tierKey(cands[k]),pk=tierKey(cands[k-1]);if(pk<1e9&&kk-pk>=4)rows.push('<div class="tierbreak" title="Talent cliff"></div>');}
    i=cands[k];var pl2=PLAYERS[i];
    var rlabel=srt==="cons"?consRank(pl2).toFixed(1):pl2.r;
    var sub='<span>ADP '+disp(pl2.adp)+'</span><span>Last '+disp(pl2.last)+'</span><span>Tot '+disp(pl2.lastTotal)+'</span><span>'+posBadges(pl2.p)+'</span>';
    if(pl2.c.length)sub+='<span>'+pl2.c.slice(0,3).join(" · ")+'</span>';
    rows.push('<div class="prow"><div class="l1"><span class="prank">'+rlabel+'</span><span class="pname">'+esc(pl2.n)+' <span class="teamtag">'+esc(pl2.t)+'</span></span><button class="draftbtn" data-pi="'+i+'" aria-label="Draft '+esc(pl2.n)+'"'+(ut?'':' disabled')+'>Draft</button></div><div class="l2">'+sub+'</div></div>');
  }
  if(!cands.length)rows.push('<div class="prow"><div class="l1"><span class="muted">No players match.</span></div></div>');
  el("mdplist").innerHTML=rows.join("");
  var pager='<div class="pager"><button class="ghostbtn" id="mdprev" '+(state.page?"":"disabled")+'>Previous</button><button class="ghostbtn" id="mdnext" '+(state.page+1<pageCount?"":"disabled")+'>Next</button></div>';
  el("mdpager").innerHTML=pager;
  el("mdplist").querySelectorAll(".draftbtn").forEach(function(b){b.addEventListener("click",function(){userDraft(parseInt(b.getAttribute("data-pi"),10));});});
  el("mdprev").addEventListener("click",function(){state.page=Math.max(0,state.page-1);save();renderList();});
  el("mdnext").addEventListener("click",function(){state.page=Math.min(pageCount-1,state.page+1);save();renderList();});
}
function myRoster(){
  var entries=CORE.teamEntries(PLAYERS,state.log,userTeam(),TEAMS);
  return CORE.assignRoster(entries,draftSlots());
}
function renderSide(){
  var s=el("mdside");if(!s)return;  if(state.view==="board"){
    var h='<h3>Draft board</h3><div class="boardwrap"><table class="board"><tr><th>Rd</th>';
    for(var t=0;t<TEAMS;t++)h+='<th>'+esc(teamName(t))+'</th>';
    h+='</tr>';
    for(var r=0;r<state.rounds;r++){
      h+='<tr><td><b>'+(r+1)+'</b></td>';
      for(t=0;t<TEAMS;t++){
        var idx=r*TEAMS+(r%2===0?t:TEAMS-1-t);
        var cell='&nbsp;',cls=(t===userTeam()?'you':'');
        if(idx<state.log.length){var pl=PLAYERS[state.log[idx]];cell=esc(pl.n)+' <span class="teamtag">'+esc(pl.t)+'</span>'+vBadge(state.log[idx],idx);}
        else if(t===userTeam()){cls+=' future-you';}
        h+='<td class="'+cls+'">'+cell+'</td>';
      }
      h+='</tr>';
    }
    s.innerHTML=h+'</table></div>';
  }else{
    var mine=[];state.log.forEach(function(pi,idx){if(teamForPick(idx)===userTeam())mine.push({pi:pi,idx:idx});});
    var ros=myRoster();
    var h2='<h3>Roster</h3><div class="rlist">';
    ros.slots.forEach(function(e){
      h2+='<div class="rrow"><span class="rpick">'+e.slot+'</span><span class="pname">'+(e.player?esc(e.player.player.n)+' <span class="teamtag">'+esc(e.player.player.t)+'</span>':'<span class="muted">empty</span>')+'</span>'+(e.player?'<span class="ppos">'+posBadges(e.player.player.p)+'</span>':'')+'</div>';});
    h2+='</div>';
    if(ros.overflow.length){h2+='<h3>Overflow</h3><div class="rlist">';ros.overflow.forEach(function(e){h2+='<div class="rrow"><span class="pname">'+esc(e.player.n)+'</span></div>';});h2+='</div>';}
    h2+='<h3>My team ('+mine.length+'/'+state.rounds+')</h3><div class="rlist">';
    if(!mine.length)h2+='<div class="rrow"><span class="muted">No picks yet.</span></div>';
    mine.forEach(function(m){var pl=PLAYERS[m.pi];
      h2+='<div class="rrow"><span class="rpick">'+pickLabel(m.idx)+'</span><span class="pname">'+esc(pl.n)+' <span class="teamtag">'+esc(pl.t)+'</span>'+vBadge(m.pi,m.idx)+'</span><span class="ppos">'+posBadges(pl.p)+'</span></div>';});
    s.innerHTML=h2+'</div>';
  }
}
function renderDone(){
  var h='<h2>Draft complete</h2><div class="muted">Final roster from pick #'+state.draftPos+' ('+state.rounds+' rounds, 12 teams)</div>';
  h+='<button class="bigbtn" id="mdnew2">Run it back</button>';
  if(state.userTurns.length)h+='<button class="ghostbtn" id="mdundo2" style="margin-left:8px">Undo my last pick</button>';
  h+='<div class="tabs"><button class="fchip'+(state.view==='team'?' sel':'')+'" data-view="team">My team</button><button class="fchip'+(state.view==='board'?' sel':'')+'" data-view="board">Draft board</button></div><div id="mdside"></div>';
  el("mdapp").innerHTML=h;
  el("mdnew2").addEventListener("click",restartDraft);
  var undo=el("mdundo2");if(undo)undo.addEventListener("click",undoUserPick);
  el("mdapp").querySelectorAll("[data-view]").forEach(function(b){b.addEventListener("click",function(){setState({view:b.getAttribute("data-view")});});});
  renderSide();
}
function render(){
  if(state.phase==="setup")renderSetup();
  else if(state.phase==="done")renderDone();
  else renderDraft();
}
render();
})();
</script>

</body>
</html>
